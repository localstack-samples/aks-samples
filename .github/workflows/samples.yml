name: Test samples on LocalStack for Azure

# Creates the AKS cluster on the LocalStack for Azure emulator, deploys a sample's Python or .NET web
# app with its numbered scripts, one job per app, and checks the app end to end with
# tests/test-vacation-planner.sh. As in the Samples CI of localstack-azure-samples, a pull request or a
# push runs the apps it changes (every app when a file all of them use changes), and a manual run can
# choose to run every app.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_mode:
        description: "'all' runs every sample, 'changed' runs only the samples with modified files"
        required: false
        type: choice
        options:
          - all
          - changed
        default: changed
      windows:
        description: "Run only the Windows job, every sample from Git Bash with MSYS_NO_PATHCONV=1, instead of the Linux matrix (run_mode does not apply)"
        required: false
        type: boolean
        default: false

permissions: {}

# A new push to the same pull request cancels the run it supersedes: with one job per sample and
# language, a stale run would otherwise hold up to twenty runners for the length of a deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    name: Select samples
    # Pull requests from forks get no secrets, so lstk could not start the emulator there
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_samples: ${{ steps.select.outputs.has_samples }}

    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The full history, so that 'changed' mode can compare with the base commit
          fetch-depth: 0

      - name: Select the samples to run
        id: select
        env:
          # Pull requests and pushes have no inputs: they run the samples they change. A manual run with the
          # windows input runs every sample, on Windows
          RUN_MODE: ${{ inputs.windows && 'all' || inputs.run_mode || 'changed' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Every app a job can deploy, as samples/<sample>/<language>, so a new sample needs no change here
          apps=$(printf '%s\n' samples/*/*/scripts/05-deploy-app.sh | sed 's|/scripts/05-deploy-app\.sh$||')
          selected=$apps

          if [ "$RUN_MODE" = changed ]; then
            case $EVENT_NAME in
              pull_request) base=$PR_BASE_SHA ;;
              push) base=$PUSH_BEFORE_SHA ;;
              *) base=origin/main ;;
            esac
            if git rev-parse --quiet --verify "$base^{commit}" > /dev/null; then
              changed=$(git diff --name-only "$base...HEAD")
              echo "Files changed since $base:"
              echo "$changed"
              # Every job creates the cluster with the same script and checks the app with the same test, so a
              # change to either, or to this workflow, runs every app; otherwise an app runs when its folder changes
              shared='^(scripts/01-system-assigned-managed-identity\.sh|tests/test-vacation-planner\.sh|\.github/workflows/samples\.yml)$'
              if ! grep -q -E "$shared" <<< "$changed"; then
                selected=$(while read -r app; do
                  if grep -q "^$app/" <<< "$changed"; then echo "$app"; fi
                done <<< "$apps")
              fi
            else
              # A push that creates the branch or rewrites its history leaves no base commit to compare with
              echo "Base commit '$base' not found: running every sample"
            fi
          fi

          matrix=$(jq -n -R -c '[inputs | select(length > 0) | split("/") | {sample: .[1], language: .[2]}] | {include: .}' <<< "$selected")
          echo "Samples to run: $(jq -r '[.include[] | "\(.sample) (\(.language))"] | if length > 0 then join(", ") else "none" end' <<< "$matrix")"
          {
            echo "matrix=$matrix"
            echo "has_samples=$(jq '.include | length > 0' <<< "$matrix")"
          } >> "$GITHUB_OUTPUT"

  sample:
    name: ${{ matrix.sample }} (${{ matrix.language }})
    needs: setup
    # Skip the job when the run changes no sample, and on a manual run with the windows input, which runs the
    # Windows job instead
    if: needs.setup.outputs.has_samples == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.windows)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SAMPLE: ${{ matrix.sample }}
      LANGUAGE: ${{ matrix.language }}

    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install lstk
        # Pinned like actions/checkout, so an lstk release cannot change every run at once: bump it deliberately
        run: npm install -g @localstack/lstk@1.4.0

      - name: Install sqlcmd
        # The Azure SQL Database sample seeds its database with sqlcmd, which the runner image does not ship
        if: matrix.sample == 'web-app-sql-database'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Create the SSH key the cluster script provisions the node pools with
        run: ssh-keygen -t rsa -b 4096 -N '' -f ~/.ssh/id_rsa -q

      - name: Start the LocalStack for Azure emulator
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          # lstk forwards LOCALSTACK_-prefixed variables to the emulator. The Azure SQL Database sample
          # needs the SQL Server EULA accepted, as its README and the localstack-azure-samples CI do
          LOCALSTACK_MSSQL_ACCEPT_EULA: "Y"
          # The emulator looks up the k3d release behind each AKS cluster on api.github.com. Anonymous
          # calls share the runner IP's 60 requests an hour, which twenty parallel jobs can exhaust, so pass
          # the run's own read-only token, as the localstack-azure-samples CI does
          LOCALSTACK_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          lstk start --type azure --non-interactive
          lstk az start-interception

      # The script prompts for the network configuration and both node pool sizes:
      # pick option 1 (Azure network plugin and policy) and keep the default sizes
      - name: Create the AKS cluster
        working-directory: scripts
        run: printf '1\n\n\n' | ./01-system-assigned-managed-identity.sh

      - name: Deploy the sample
        working-directory: samples/${{ matrix.sample }}/${{ matrix.language }}/scripts
        env:
          # Answer the Azure Files sample's two provisioning menus; the other samples do not read these
          PROVISIONING_MODE: static
          FILE_SHARE_PROTOCOL: smb
        run: |
          ./01-deploy-resources.sh
          ./02-build-docker-image.sh
          ./04-push-docker-image.sh
          ./05-deploy-app.sh

      - name: Test the web app
        run: |
          variables="samples/$SAMPLE/$LANGUAGE/scripts/00-variables.sh"
          namespace=$(sed -n "s/^NAMESPACE=\"\(.*\)\"/\1/p" "$variables")
          service=$(sed -n "s/^SERVICE_NAME=\"\(.*\)\"/\1/p" "$variables")
          ./tests/test-vacation-planner.sh "$namespace" "$service"

      - name: Show cluster state and emulator logs
        if: failure()
        run: |
          kubectl get pods --all-namespaces -o wide || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -50 || true
          for ns in $(kubectl get namespaces -o name | sed 's|namespace/||' | grep vacation-planner); do
            kubectl describe pods --namespace "$ns" | tail -80 || true
            kubectl logs --namespace "$ns" --all-containers --tail=100 -l "app=$ns" || true
          done
          lstk logs | tail -300 || true

  # Runs every sample on Windows, from Git Bash with MSYS_NO_PATHCONV=1 set as the README asks Windows
  # users to do, on manual runs with the windows input only. The emulator is a Linux image and Docker on
  # the Windows runner runs Windows containers, so the emulator runs in Docker Engine inside a WSL 2
  # distribution on the same runner; the Windows docker CLI, lstk and kubectl reach it through ports WSL
  # forwards to the runner's localhost.
  windows:
    name: Windows (Git Bash) ${{ matrix.sample }} (${{ matrix.language }})
    needs: setup
    if: github.event_name == 'workflow_dispatch' && inputs.windows && needs.setup.outputs.has_samples == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Every app: on a manual run with the windows input, the setup job selects all of them
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      SAMPLE: ${{ matrix.sample }}
      LANGUAGE: ${{ matrix.language }}
      IMAGE: localstack/localstack-azure:latest
      # The Docker Engine in WSL 2, for the Windows docker CLI and lstk
      DOCKER_HOST: tcp://127.0.0.1:2375
      # What the README asks Windows users of Git Bash and MSYS2 to export
      MSYS_NO_PATHCONV: "1"

    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configure WSL
        # Once a step's wsl.exe session ends, WSL stops the idle distribution after 15 seconds, and
        # dockerd with it; -1 keeps it running for the whole job. The memory leaves room for the AKS
        # cluster and the sample's workloads.
        shell: pwsh
        run: |
          Set-Content -Path "$env:USERPROFILE\.wslconfig" -Value "[wsl2]`nmemory=12GB`n`n[general]`ninstanceIdleTimeout=-1"
          wsl --shutdown

      - name: Set up Ubuntu in WSL 2
        id: wsl
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          wsl-shell-user: root
          additional-packages: docker.io

      - name: Start Docker Engine in WSL 2
        # Installing docker.io already started a daemon on the Unix socket alone, and a second one cannot
        # start beside it, so it is stopped and replaced by one that also listens on TCP. The Unix socket
        # is what the emulator container mounts to start the cluster and its backing containers; the TCP
        # endpoint, bound to localhost, is what WSL forwards to Windows. The wait asks the TCP endpoint,
        # so the step fails when that daemon did not start.
        shell: wsl-bash {0}
        run: |
          if [ -d /run/systemd/system ]; then
            systemctl disable --now docker.socket docker.service
          elif [ -e /var/run/docker.pid ]; then
            kill "$(cat /var/run/docker.pid)"
          fi
          for _ in $(seq 1 30); do
            [ -e /var/run/docker.pid ] || break
            sleep 1
          done
          if [ -e /var/run/docker.pid ]; then
            echo "::error::The Docker daemon that installing docker.io started is still running"
            exit 1
          fi
          setsid nohup dockerd --host unix:///var/run/docker.sock --host tcp://127.0.0.1:2375 --tls=false \
            > /var/log/dockerd.log 2>&1 < /dev/null &
          for _ in $(seq 1 60); do
            docker --host tcp://127.0.0.1:2375 info > /dev/null 2>&1 && break
            sleep 2
          done
          docker --host tcp://127.0.0.1:2375 info \
            --format 'Docker {{.ServerVersion}} on {{.OperatingSystem}}, kernel {{.KernelVersion}}'

      - name: Check that the Windows docker CLI reaches it
        run: docker version

      - name: Install lstk
        # The release the Linux job pins
        run: npm install -g @localstack/lstk@1.4.0

      - name: Give lstk an Azure CLI path without spaces
        # lstk sets up the Azure CLI with `az cloud register --cloud-config <JSON>`, run through az.cmd, and
        # cmd.exe cuts that command line at the space of "C:\Program Files" once the JSON's quotes are in it
        # ("'C:\Program' is not recognized"), so `lstk az start-interception` (lstk 1.4.0) fails wherever the
        # Azure CLI sits in its default folder. A junction without spaces, first on the PATH, works around it
        # until lstk passes the JSON another way; Git Bash runs the same Azure CLI through it.
        shell: pwsh
        run: |
          $cliDir = Split-Path -Parent (Split-Path -Parent (Get-Command az.cmd).Source)
          New-Item -ItemType Junction -Path C:\azure-cli -Target $cliDir | Out-Null
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\azure-cli\wbin'

      - name: Install yq
        # The deployment scripts render the Kubernetes manifests with yq, which the Windows runner image
        # does not ship. The release and its SHA-256 are pinned.
        env:
          YQ_VERSION: v4.54.1
          YQ_SHA256: b645f47ebb3a0d2fbab52998550bbd0a1706f23b5ca5f5b48e638c580bb70928
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl --silent --show-error --fail --location --retry 3 --output yq.exe \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_windows_amd64.exe"
          echo "${YQ_SHA256}  yq.exe" | sha256sum --check
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install sqlcmd
        # The Azure SQL Database sample seeds its database with sqlcmd, which the runner image does not ship:
        # the Go sqlcmd release, pinned with its SHA-256
        if: matrix.sample == 'web-app-sql-database'
        env:
          SQLCMD_VERSION: v1.10.0
          SQLCMD_SHA256: a4c28332fcc6e497d655e53ac8f4939f4ab170f9cfd32d0fa5081b60f4d9d691
        run: |
          curl --silent --show-error --fail --location --retry 3 --output "$RUNNER_TEMP/sqlcmd.zip" \
            "https://github.com/microsoft/go-sqlcmd/releases/download/${SQLCMD_VERSION}/sqlcmd-windows-amd64.zip"
          echo "${SQLCMD_SHA256}  $RUNNER_TEMP/sqlcmd.zip" | sha256sum --check
          unzip -o -q -j "$RUNNER_TEMP/sqlcmd.zip" sqlcmd.exe -d "$RUNNER_TEMP/bin"
          sqlcmd --version

      - name: Create the SSH key the cluster script provisions the node pools with
        run: ssh-keygen -t rsa -b 4096 -N '' -f ~/.ssh/id_rsa -q

      - name: Start the LocalStack for Azure emulator in WSL 2
        # Started with the docker CLI rather than lstk: lstk on Windows would mount a Windows volume path,
        # and no Docker socket, into the Linux engine. The two mounts are paths inside WSL, which
        # MSYS_NO_PATHCONV keeps Git Bash from rewriting. lstk then finds the container by its name to
        # route the Azure CLI to it.
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          # The emulator looks up the k3d release behind each AKS cluster on api.github.com, as on Linux
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          docker pull "$IMAGE"
          docker run --detach --name localstack-azure \
            --publish 127.0.0.1:4566:4566 --publish 127.0.0.1:443:443 \
            --publish 127.0.0.1:4510-4559:4510-4559 \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume /var/lib/localstack-azure:/var/lib/localstack \
            --env LOCALSTACK_AUTH_TOKEN --env GITHUB_API_TOKEN --env MSSQL_ACCEPT_EULA=Y \
            "$IMAGE"
          ready=0
          for _ in $(seq 1 200); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:4566/_localstack/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ $ready != 1 ]]; then
            echo "::error::The emulator did not answer on 127.0.0.1:4566 within 400s"
            docker logs --tail 100 localstack-azure
            exit 1
          fi
          lstk az start-interception

      # The script prompts for the network configuration and both node pool sizes:
      # pick option 1 (Azure network plugin and policy) and keep the default sizes
      - name: Create the AKS cluster
        working-directory: scripts
        run: printf '1\n\n\n' | ./01-system-assigned-managed-identity.sh

      - name: Deploy the sample
        working-directory: samples/${{ matrix.sample }}/${{ matrix.language }}/scripts
        env:
          # Answer the Azure Files sample's two provisioning menus, as the Linux job does
          PROVISIONING_MODE: static
          FILE_SHARE_PROTOCOL: smb
        run: |
          ./01-deploy-resources.sh
          ./02-build-docker-image.sh
          ./04-push-docker-image.sh
          ./05-deploy-app.sh

      - name: Test the web app
        run: |
          variables="samples/$SAMPLE/$LANGUAGE/scripts/00-variables.sh"
          namespace=$(sed -n "s/^NAMESPACE=\"\(.*\)\"/\1/p" "$variables")
          service=$(sed -n "s/^SERVICE_NAME=\"\(.*\)\"/\1/p" "$variables")
          ./tests/test-vacation-planner.sh "$namespace" "$service"

      - name: Show cluster state and emulator logs
        if: failure()
        run: |
          kubectl get pods --all-namespaces -o wide || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -50 || true
          for ns in $(kubectl get namespaces -o name | sed 's|namespace/||' | grep vacation-planner); do
            kubectl describe pods --namespace "$ns" | tail -80 || true
            kubectl logs --namespace "$ns" --all-containers --tail=100 -l "app=$ns" || true
          done
          docker logs localstack-azure 2>&1 | tail -n 300 || true

      - name: Get the Docker Engine log
        # The wsl-bash shell exists only once WSL is set up
        if: failure() && steps.wsl.outcome == 'success'
        shell: wsl-bash {0}
        run: tail -n 100 /var/log/dockerd.log || true
