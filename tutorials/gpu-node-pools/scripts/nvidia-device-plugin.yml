# The NVIDIA device plugin DaemonSet from Microsoft's guide to installing it by hand
# (https://learn.microsoft.com/en-us/azure/aks/use-nvidia-gpu#manually-install-the-nvidia-device-plugin), with two
# additions: a node selector for the accelerator=nvidia label AKS gives GPU nodes, so it runs only there, and a
# toleration for the taint AKS gives Spot nodes. 02-deploy-device-plugin.sh fills in the name, the namespace, the image
# and the tolerations.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ""
  namespace: ""
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "gpu"
          effect: "NoSchedule"
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
      # Mark this pod as a critical add-on, so that it is rescheduled first after a failure
      priorityClassName: "system-node-critical"
      containers:
        - image: ""
          name: nvidia-device-plugin-ctr
          env:
            # Wait instead of exiting when the node has no GPU the plugin can use
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
