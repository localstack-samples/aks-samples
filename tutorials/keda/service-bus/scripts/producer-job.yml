# Fills the queue so the scaler has a backlog to react to.
#
# A Job's pod template is immutable once created, so the script deletes any previous Job before
# applying this one; ttlSecondsAfterFinished additionally lets the TTL-after-finished controller
# reap the finished Job on its own.
# https://kubernetes.io/docs/concepts/workloads/controllers/job/
apiVersion: batch/v1
kind: Job
metadata:
  name: sb-producer # Patched from PRODUCER_JOB_NAME.
  namespace: keda-service-bus-sample # Patched from NAMESPACE.
spec:
  backoffLimit: 2 # Retries before the Job is marked failed. Low on purpose: a send that fails twice is a real error, not a blip.
  ttlSecondsAfterFinished: 300 # Delete the finished Job (and its pod) after five minutes, so re-runs start clean.
  template:
    metadata:
      labels:
        app: sb-producer
    spec:
      restartPolicy: Never # Required for Jobs that must not retry in place; backoffLimit creates a fresh pod instead.
      containers:
        - name: producer # Container name within the pod; the scripts use it for `kubectl logs -c`.
          image: <your-registry>/keda-servicebus-producer:v1 # Patched at apply time from the ACR login server.
          imagePullPolicy: Always # Always re-pull, so rebuilding the image with the same tag takes effect. Patched from IMAGE_PULL_POLICY.
          envFrom:
            # The producer needs QUEUE_NAME and MESSAGE_COUNT from the config map and
            # SERVICEBUS_CONNECTION from the secret.
            - configMapRef:
                name: sb-app-config # Non-secret settings. Patched from CONFIG_MAP_NAME.
            - secretRef:
                name: sb-connection # The namespace connection string. Patched from SECRET_NAME.
