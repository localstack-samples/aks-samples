# The Service Bus namespace connection string, read from the authorization rule at deploy time and
# injected base64-encoded. The emulator's connection string carries UseDevelopmentEmulator=true and
# the sb:// scheme, and must be used verbatim: rewriting it makes the SDK force TLS on port 5671,
# which the emulator's plain-TCP AMQP listener does not serve.
#
# Only the applications read this. The scaler does not: it authenticates to the management API with
# the shared managed identity through the TriggerAuthentication, so the ScaledObject holds no
# connection string of its own.
apiVersion: v1
kind: Secret
metadata:
  name: sb-connection # Patched from SECRET_NAME; must match the envFrom.secretRef entries.
  namespace: keda-service-bus-sample # Patched from NAMESPACE. A Secret is only readable in its own namespace.
type: Opaque # Arbitrary key/value pairs. The typed kinds (kubernetes.io/tls and friends) impose a fixed key set.
# `data` takes base64-encoded values, which is what 06-deploy-consumer.sh pipes in. The alternative,
# `stringData`, takes plaintext and is encoded by the API server; `data` is used here so the script can
# pass the value through `base64 -w0` and never write a plaintext credential into a manifest.
data:
  SERVICEBUS_CONNECTION: "" # Connection string of the namespace authorization rule. Read by the producer and the consumer.
