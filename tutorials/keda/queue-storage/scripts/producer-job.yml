# Fills the queue so the scaler has a backlog to react to.
#
# A Job's pod template is immutable once created, so the script deletes any previous Job before
# applying this one; ttlSecondsAfterFinished additionally lets the TTL-after-finished controller reap
# the finished Job on its own.
# https://kubernetes.io/docs/concepts/workloads/controllers/job/
#
# Like the consumer, the pod template carries the azure.workload.identity/use: "true" label and runs as
# the queue-app service account, so the producer authenticates with Microsoft Entra Workload ID and
# envFrom references only the config map.
apiVersion: batch/v1
kind: Job
metadata:
  name: queue-producer # Patched from PRODUCER_JOB_NAME.
  namespace: keda-queue-storage-sample # Patched from NAMESPACE.
spec:
  backoffLimit: 2 # Retries before the Job is marked failed. Low on purpose: a send that fails twice is a real error, not a blip.
  ttlSecondsAfterFinished: 300 # Delete the finished Job (and its pod) after five minutes, so re-runs start clean.
  template:
    metadata:
      labels:
        app: queue-producer
        azure.workload.identity/use: "true" # Without this label the webhook does not mutate the pod and no token is projected.
    spec:
      restartPolicy: Never # Required for Jobs that must not retry in place; backoffLimit creates a fresh pod instead.
      serviceAccountName: queue-app # The identity half of the chain; its annotations name the managed identity. Patched from SERVICE_ACCOUNT_NAME.
      containers:
        - name: producer # Container name within the pod; the scripts use it for `kubectl logs -c`.
          image: <your-registry>/keda-queue-producer:v1 # Patched at apply time from the ACR login server.
          imagePullPolicy: Always # Always re-pull, so rebuilding the image with the same tag takes effect. Patched from IMAGE_PULL_POLICY.
          envFrom:
            # Only the config map: the producer authenticates with workload identity, so it needs
            # QUEUE_ENDPOINT, QUEUE_NAME and MESSAGE_COUNT and no credential at all.
            - configMapRef:
                name: queue-app-config # Non-secret settings. Patched from CONFIG_MAP_NAME.
