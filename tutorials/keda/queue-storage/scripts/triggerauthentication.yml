# Tells the KEDA operator to authenticate to Azure with Microsoft Entra Workload ID, using the
# user-assigned managed identity whose client id is patched in at apply time. The operator's own
# federated credential (subject system:serviceaccount:kube-system:keda-operator) is what makes the token
# exchange possible, and the identity holds the Storage Queue Data Contributor role on the storage
# account. The producer and the consumer use the very same identity through their own service account,
# so scaler and applications share one grant.
# https://learn.microsoft.com/en-us/azure/aks/keda-workload-identity
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: queue-trigger-auth
  namespace: keda-queue-storage-sample
spec:
  podIdentity:
    provider: azure-workload
    identityId: ""
