# The service account the producer and the consumer run as, and the application half of the Microsoft
# Entra Workload ID chain.
#
# The client-id and tenant-id annotations are patched at apply time from the shared user-assigned
# managed identity and the signed-in tenant: they tell the workload-identity mutating webhook which
# identity to project a token for. The identity trusts this service account through the federated
# identity credential created by 02-create-managed-identity.sh, whose subject is
# system:serviceaccount:{namespace}:{name}. The pod templates that reference this service account also
# carry the azure.workload.identity/use: "true" label, without which the webhook does not mutate them.
# https://learn.microsoft.com/en-us/azure/aks/workload-identity-deploy-cluster
apiVersion: v1
kind: ServiceAccount
metadata:
  name: queue-app
  namespace: keda-queue-storage-sample
  annotations:
    azure.workload.identity/client-id: ""
    azure.workload.identity/tenant-id: ""
  labels:
    azure.workload.identity/use: "true"
