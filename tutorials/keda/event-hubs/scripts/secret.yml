# The two connection strings the scaler and the applications authenticate with, read at deploy time and
# injected base64-encoded: the event hub's authorization rule connection string and the storage account
# connection string that addresses the checkpoint container.
#
# Both are used verbatim as returned by Azure. The emulator's Event Hubs connection string carries
# UseDevelopmentEmulator=true and the sb:// scheme, and rewriting it makes the SDK force TLS on port
# 5671, which the emulator's plain-TCP AMQP listener does not serve.
#
# The key names are contractual: the ScaledObject's trigger reads them by name through
# connectionFromEnv and storageConnectionFromEnv, so they must match scaledobject.yml exactly and must
# reach the consumer container through envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: eh-connection
  namespace: keda-event-hubs-sample
type: Opaque
data:
  EVENTHUB_CONNECTION: ""
  STORAGE_CONNECTION: ""
