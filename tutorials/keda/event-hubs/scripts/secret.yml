# The two connection strings the scaler and the applications authenticate with, read at deploy time and
# injected base64-encoded: the event hub's authorization rule connection string and the storage account
# connection string that addresses the checkpoint container.
#
# Both are used verbatim as returned by Azure. The emulator's Event Hubs connection string carries
# UseDevelopmentEmulator=true and the sb:// scheme, and rewriting it makes the SDK force TLS on port
# 5671, which the emulator's plain-TCP AMQP listener does not serve.
#
# The key names are contractual: the ScaledObject's trigger reads them by name through
# connectionFromEnv and storageConnectionFromEnv, so they must match scaledobject.yml exactly and must
# reach the consumer container through envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: eh-connection # Patched from SECRET_NAME; must match the envFrom.secretRef entries.
  namespace: keda-event-hubs-sample # Patched from NAMESPACE. A Secret is only readable in its own namespace.
type: Opaque # Arbitrary key/value pairs. The typed kinds (kubernetes.io/tls and friends) impose a fixed key set.
# `data` takes base64-encoded values, which is what 06-deploy-consumer.sh pipes in. The alternative,
# `stringData`, takes plaintext and is encoded by the API server; `data` is used here so the script can
# pass the values through `base64 -w0` and never write a plaintext credential into a manifest.
data:
  EVENTHUB_CONNECTION: "" # Connection string of the hub's authorization rule; carries EntityPath=<hub>. Read by producer, consumer and scaler.
  STORAGE_CONNECTION: "" # Connection string of the checkpoint storage account. Read by the consumer and the scaler.
