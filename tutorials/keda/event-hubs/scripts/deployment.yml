# The consumer Deployment, the workload KEDA scales.
#
# replicas: 0 is deliberate: the ScaledObject activates the Deployment when the consumer group falls
# behind and returns it to zero when it has caught up, so the sample starts from a scaled-to-zero
# state. The image reference is patched at apply time from `az acr show --query loginServer`, because
# the emulator and real Azure return different login servers.
#
# The envFrom secretRef is what puts EVENTHUB_CONNECTION and STORAGE_CONNECTION in the container's
# environment. The trigger reads them from there by name (connectionFromEnv, storageConnectionFromEnv),
# so removing it would break the scaler as well as the application.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eh-consumer
  namespace: keda-event-hubs-sample # Patched from NAMESPACE.
  labels:
    app: eh-consumer
spec:
  replicas: 0 # Start scaled to zero and let KEDA own the count from here on. Patched from MIN_REPLICAS.
  selector:
    matchLabels:
      app: eh-consumer # Must match the pod template labels below, or the Deployment is rejected.
  template:
    metadata:
      labels:
        app: eh-consumer
    spec:
      containers:
        - name: consumer # Container name within the pod; the scripts use it for `kubectl logs -c`.
          image: <your-registry>/keda-eventhub-consumer:v1 # Patched at apply time from the ACR login server.
          imagePullPolicy: Always # Always re-pull, so rebuilding the image with the same tag takes effect. Patched from IMAGE_PULL_POLICY.
          envFrom:
            # Both sources are flattened into the container's environment. Order matters only on a key
            # collision, where the later source wins; these two share no keys.
            - configMapRef:
                name: eh-app-config # Non-secret settings. Patched from CONFIG_MAP_NAME.
            - secretRef:
                name: eh-connection # The two connection strings. Patched from SECRET_NAME.
          # Requests are what the scheduler reserves and what decides whether a replica fits on a node;
          # limits are the ceiling the kubelet enforces at runtime. Both are set so the ramp is honest:
          # without a request, four replicas could be packed onto capacity that cannot really run them.
          resources:
            requests:
              cpu: 50m # 0.05 of a core. The consumer spends most of its time sleeping or awaiting I/O.
              memory: 128Mi # Enough for the Python runtime and the Event Hubs SDK client.
            limits:
              cpu: 500m # 0.5 of a core. Exceeding this throttles the container rather than killing it.
              memory: 256Mi # Exceeding this is an OOMKill, so it is set well above the steady-state usage.
