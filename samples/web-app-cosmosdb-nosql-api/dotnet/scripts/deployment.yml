apiVersion: apps/v1
kind: Deployment
metadata:
  name: vacation-planner-nosql
  namespace: vacation-planner-nosql
  labels:
    app: vacation-planner-nosql
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vacation-planner-nosql
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: vacation-planner-nosql
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: vacation-planner-nosql
          image: <your-registry>.azurecr.io/vacation-planner-nosql-dotnet:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AZURECOSMOSDB_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-nosql-config
                  key: AZURECOSMOSDB_ENDPOINT
            - name: AZURECOSMOSDB_DATABASENAME
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-nosql-config
                  key: AZURECOSMOSDB_DATABASENAME
            - name: AZURECOSMOSDB_CONTAINERNAME
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-nosql-config
                  key: AZURECOSMOSDB_CONTAINERNAME
            - name: LOGIN_NAME
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-nosql-config
                  key: LOGIN_NAME
            - name: AZURECOSMOSDB_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: vacation-planner-nosql-secrets
                  key: AZURECOSMOSDB_PRIMARY_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vacation-planner-nosql-secrets
                  key: SECRET_KEY
            # Add the LocalStack root CA to the trust store .NET uses on Linux (OpenSSL honours
            # SSL_CERT_FILE next to the system roots) so TLS verification of the Cosmos endpoint
            # succeeds. The file is mounted from the `localstack-ca` ConfigMap created by 05-deploy-app.sh.
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/localstack.crt
          volumeMounts:
            - name: localstack-ca
              mountPath: /etc/ssl/certs/localstack.crt
              subPath: localstack.crt
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: localstack-ca
          configMap:
            name: localstack-ca
            # `optional: true` lets the Deployment apply even in real-Azure mode where
            # 05-deploy-app.sh skips creating the ConfigMap. In that case drop the
            # SSL_CERT_FILE env (and the volumeMount) when switching off LocalStack.
            optional: true
