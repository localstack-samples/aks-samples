apiVersion: v1
kind: Secret
metadata:
  name: vacation-planner-file-storage
  namespace: vacation-planner-file
  labels:
    app: vacation-planner-file
type: Opaque
data:
  # Credentials the Azure Files CSI driver uses to mount the SMB share, referenced by the
  # nodeStageSecretRef of persistentvolume-smb.yml. The two key names are fixed by the driver.
  # An SMB share is mounted with the storage account key (NTLMv2), so a static SMB volume needs this
  # secret; an NFS share is not authenticated by a key at all and needs no secret.
  azurestorageaccountname: ""
  azurestorageaccountkey: ""
