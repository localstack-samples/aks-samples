apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vacation-planner-identity-issuer
  namespace: vacation-planner-identity
spec:
  acme:
    # Registration address for the Let's Encrypt account: expiry notices go here.
    # 05-deploy-app.sh replaces this with $ACME_EMAIL from 00-variables.sh.
    email: admin@example.com
    privateKeySecretRef:
      name: vacation-planner-identity-issuer
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: vacation-planner-identity
            namespace: vacation-planner-identity
            kind: Gateway
            group: gateway.networking.k8s.io
            sectionName: http
          podTemplate:
            spec:
              nodeSelector:
                kubernetes.io/os: linux
