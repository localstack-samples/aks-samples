apiVersion: v1
kind: Secret
metadata:
  name: vacation-planner-postgres-in-cluster-secrets
  namespace: vacation-planner-postgres-in-cluster
  labels:
    app: vacation-planner-postgres-in-cluster
type: Opaque
data:
