apiVersion: v1
kind: Secret
metadata:
  name: vacation-planner-postgres-secrets
  namespace: vacation-planner-postgres
  labels:
    app: vacation-planner-postgres
type: Opaque
data:
  # PG_PASSWORD is the in-cluster `testuser` password; SECRET_KEY is the ASP.NET Core Data Protection
  # key. Both are base64-injected by 05-deploy-app.sh at apply time.
  PG_PASSWORD: ""
  SECRET_KEY: ""
