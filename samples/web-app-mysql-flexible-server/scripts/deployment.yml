apiVersion: apps/v1
kind: Deployment
metadata:
  name: vacation-planner-mysql
  namespace: vacation-planner-mysql
  labels:
    app: vacation-planner-mysql
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vacation-planner-mysql
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: vacation-planner-mysql
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: vacation-planner-mysql
          image: <your-registry>.azurecr.io/vacation-planner-mysql:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-mysql-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-mysql-config
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-mysql-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-mysql-config
                  key: MYSQL_USER
            - name: MYSQL_SSL
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-mysql-config
                  key: MYSQL_SSL
            - name: LOGIN_NAME
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-mysql-config
                  key: LOGIN_NAME
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-mysql-config
                  key: DEBUG
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vacation-planner-mysql-secrets
                  key: MYSQL_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vacation-planner-mysql-secrets
                  key: SECRET_KEY
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
