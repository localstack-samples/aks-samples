# The identity the App Configuration Kubernetes Provider uses to read the store and the key vault.
# The two annotations are what turn a plain Kubernetes service account into a Microsoft Entra Workload ID
# subject: the provider asks the Kubernetes TokenRequest API for a token bound to this service account and
# exchanges it for an Entra token of the annotated client id. 05-deploy-app.sh fills both in and applies
# this manifest on every run, so a re-created managed identity (new client id) is corrected rather than
# silently left pointing at the old one.
#
# There is no azure.workload.identity/use label here and none on the app's pod template: the application
# never calls Azure. It reads plain environment variables. Only the provider's own controller pod, which
# the extension installs in the azappconfig-system namespace, carries that label.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vacation-planner-appconfig-sa
  namespace: vacation-planner-appconfig
  labels:
    app: vacation-planner-appconfig
  annotations:
    azure.workload.identity/client-id: ""
    azure.workload.identity/tenant-id: ""
