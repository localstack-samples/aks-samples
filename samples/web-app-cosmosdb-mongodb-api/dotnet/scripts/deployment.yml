apiVersion: apps/v1
kind: Deployment
metadata:
  name: vacation-planner-mongodb
  namespace: vacation-planner-mongodb
  labels:
    app: vacation-planner-mongodb
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vacation-planner-mongodb
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: vacation-planner-mongodb
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: vacation-planner-mongodb
          image: <your-registry>.azurecr.io/vacation-planner-mongodb-dotnet:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: COSMOSDB_DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-mongodb-config
                  key: COSMOSDB_DATABASE_NAME
            - name: COSMOSDB_COLLECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-mongodb-config
                  key: COSMOSDB_COLLECTION_NAME
            - name: LOGIN_NAME
              valueFrom:
                configMapKeyRef:
                  name: vacation-planner-mongodb-config
                  key: LOGIN_NAME
            - name: COSMOSDB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: vacation-planner-mongodb-secrets
                  key: COSMOSDB_CONNECTION_STRING
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vacation-planner-mongodb-secrets
                  key: SECRET_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
